[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-quant"
version = "0.1.0"
description = "Risk-first, pre-MT5 quantitative research and paper-trading system"
requires-python = ">=3.12"
dependencies = ["python-dotenv>=1.0", "tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.14"]
ml = ["scikit-learn>=1.4"]
postgres = ["psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
include = ["astra*"]

[tool.setuptools.package-data]
astra = ["sandbox_web/*.html", "sandbox_web/*.css", "sandbox_web/*.js", "training_arena_web/*.html", "training_arena_web/*.css", "training_arena_web/*.js", "progress_desk_web/*.html", "progress_desk_web/*.css", "progress_desk_web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not socket'"
markers = [
    "live: explicit opt-in integration test requiring ASTRA_RUN_LIVE_TESTS=true",
    "socket: explicit loopback HTTP integration test; run with -m socket where loopback is allowed",
]

[tool.ruff.lint]
# Frozen dataclass value objects make constructor defaults immutable and safe.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
